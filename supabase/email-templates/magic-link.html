<!--
  MBT·Gym — OTP inlogcode (Supabase Auth → "Magic Link" template)

  Deze template wordt door Supabase verstuurd bij signInWithOtp (zowel de
  patiënt-onboarding `invite.request` als de reguliere login). Hij staat hier
  alleen ter versiebeheer; de actieve versie leeft in het Supabase-dashboard:
  Authentication → Emails → Magic Link. Plak de inhoud hieronder daar 1-op-1 in.

  Huisstijl gelijkgetrokken met src/server/mail.ts (layout()): donkere
  achtergrond #0A0E0F, surface #141A1B, oranje accent #e87a55.

  Supabase-variabele: {{ .Token }} = de 6-cijfer code.
  Onderwerp (Subject heading): Jouw MBT·Gym inlogcode
-->
<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MBT·Gym</title>
</head>
<body style="margin:0;padding:0;background:#0A0E0F;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0A0E0F;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#141A1B;border:1px solid rgba(255,255,255,0.12);border-radius:20px;overflow:hidden;">
        <tr><td style="padding:28px 28px 12px 28px;">
          <div style="font-family:ui-monospace,Menlo,'SF Mono',monospace;font-size:11px;letter-spacing:0.2em;color:#e87a55;font-weight:900;">● MBT · GYM</div>
        </td></tr>

        <tr><td style="padding:8px 28px 0 28px;">
          <h1 style="margin:0;padding:4px 0 0 0;font-size:32px;line-height:38px;font-weight:900;letter-spacing:-1.5px;color:#F5F7F6;text-transform:uppercase;">
            JOUW INLOGCODE
          </h1>
        </td></tr>
        <tr><td style="padding:16px 28px 0 28px;">
          <p style="margin:0;color:#7B8889;font-size:15px;line-height:22px;">
            Vul deze 6-cijferige code in op het MBT·Gym inlogscherm om verder te gaan.
          </p>
        </td></tr>

        <tr><td style="padding:24px 28px 0 28px;">
          <div style="background:#e87a55;color:#0A0E0F;text-align:center;padding:22px 24px;border-radius:14px;font-family:ui-monospace,Menlo,'SF Mono',monospace;font-size:38px;line-height:1;font-weight:900;letter-spacing:0.22em;">
            {{ .Token }}
          </div>
        </td></tr>

        <tr><td style="padding:18px 28px 0 28px;">
          <p style="margin:0;text-align:center;color:#7B8889;font-size:13px;line-height:19px;">
            Deel deze code nooit met iemand anders.
          </p>
        </td></tr>
        <tr><td style="padding:16px 28px 20px 28px;">
          <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:12px;">
            <div style="font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:0.14em;color:#7B8889;font-weight:700;text-transform:uppercase;margin-bottom:6px;">GELDIG</div>
            <div style="color:#F5F7F6;font-size:14px;font-weight:700;">10 minuten</div>
            <p style="margin:8px 0 0 0;color:#7B8889;font-size:12px;line-height:18px;">
              Heb je deze mail niet aangevraagd? Dan kun je hem negeren.
            </p>
          </div>
        </td></tr>

        <tr><td style="padding:20px 28px 28px 28px;border-top:1px solid rgba(255,255,255,0.12);">
          <div style="font-family:ui-monospace,Menlo,'SF Mono',monospace;font-size:10px;letter-spacing:0.14em;color:#7B8889;text-transform:uppercase;font-weight:700;">
            MOVEMENT BASED THERAPY · movementbasedtherapy.nl
          </div>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
